
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaPure Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f9fc;
            color: #222;
        }

        header {
            background: #063b5c;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        h2 {
            text-align: center;
            margin: 30px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px #ddd;
        }

        .item img {
            width: 100%;
            height: 230px;
            object-fit: contain;
        }

        footer {
            background: #063b5c;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>AquaPure Gallery</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<h2>Explore Our Collections</h2>

<div class="gallery">

    <div class="item">
        <img src="classic botteles.jpg" alt="Classic Bottles">
        <h3>Classic Bottles</h3>
    </div>

    <div class="item">
        <img src="ocean style.jpg" alt="Ocean Style">
        <h3>Ocean Style</h3>
    </div>

    <div class="item">
        <img src="sports bottles.jpg" alt="Sports Bottles">
        <h3>Sports Bottles</h3>
    </div>

    <div class="item">
        <img src="pink collection.png" alt="Pink Collection">
        <h3>Pink Collection</h3>
    </div>

    <div class="item">
        <img src="Travel Collection.png" alt="Travel Collection">
        <h3>Travel Collection</h3>
    </div>

    <div class="item">
        <img src="daily collection.jpg" alt="Daily Collection">
        <h3>Daily Collection</h3>
    </div>

</div>

<footer>
    <p>&copy; 2026 AquaPure. All rights reserved.</p>
</footer>

</body>
</html>
